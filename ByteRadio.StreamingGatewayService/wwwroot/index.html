<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>ByteRadio Live Player</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #eee; display: flex; flex-direction: column; align-items: center; padding-top: 60px; }
        button { font-size: 1.2rem; padding: 10px 24px; border-radius: 8px; border: none; cursor: pointer; }
        #startBtn { background: #4caf50; color: white; }
        #stopBtn { background: #e53935; color: white; }
        #status { margin-top: 20px; font-size: 1rem; color: #9e9e9e; }
    </style>
</head>
<body>
    <h1>ByteRadio Live Player</h1>
    <div>
        <button id="startBtn">Play</button>
        <button id="stopBtn" disabled>Stop</button>
    </div>
    <div id="status">Idle</div>
    <audio id="player" autoplay></audio>

    <script>
        const MIME_TYPE = 'audio/mpeg';

        let webSocket = null;
        let mediaSource = null;
        let sourceBuffer = null;
        const pendingChunks = [];

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusEl = document.getElementById('status');
        const player = document.getElementById('player');

        function setStatus(text) {
            statusEl.textContent = text;
        }

        function appendNextChunk() {
            if (!sourceBuffer || sourceBuffer.updating || pendingChunks.length === 0) {
                return;
            }

            try {
                sourceBuffer.appendBuffer(pendingChunks.shift());
            } catch (err) {
                console.error('Failed to append MP3 chunk', err);
            }
        }

        function connect() {

            // TODO: Replace with your actual WebSocket server URL
            const url = `wss://192.168.1.7:5011/LiveStreamListener/connect`;

            webSocket = new WebSocket(url);
            webSocket.binaryType = 'arraybuffer';

            webSocket.onopen = () => setStatus('Connected. Buffering audio...');

            webSocket.onmessage = (event) => {
                if (!(event.data instanceof ArrayBuffer) || event.data.byteLength === 0) {
                    return;
                }

                pendingChunks.push(event.data);
                appendNextChunk();
                setStatus('Playing...');
            };

            webSocket.onerror = (err) => {
                console.error('WebSocket error', err);
                setStatus('Connection error');
            };

            webSocket.onclose = () => {
                setStatus('Disconnected');
                stopPlayback();
            };
        }

        function startPlayback() {
            pendingChunks.length = 0;
            mediaSource = new MediaSource();
            player.src = URL.createObjectURL(mediaSource);

            mediaSource.addEventListener('sourceopen', () => {
                sourceBuffer = mediaSource.addSourceBuffer(MIME_TYPE);
                sourceBuffer.addEventListener('updateend', appendNextChunk);

                connect();
            }, { once: true });

            player.play().catch(() => { /* will start once data is available */ });

            startBtn.disabled = true;
            stopBtn.disabled = false;
        }

        function stopPlayback() {
            if (webSocket) {
                webSocket.onclose = null;
                webSocket.close();
                webSocket = null;
            }

            player.pause();
            player.removeAttribute('src');
            player.load();

            if (mediaSource && mediaSource.readyState === 'open') {
                try {
                    mediaSource.endOfStream();
                } catch (err) {
                    console.error('Failed to end media source stream', err);
                }
            }

            mediaSource = null;
            sourceBuffer = null;
            pendingChunks.length = 0;

            startBtn.disabled = false;
            stopBtn.disabled = true;
            setStatus('Idle');
        }

        startBtn.addEventListener('click', startPlayback);
        stopBtn.addEventListener('click', stopPlayback);
    </script>
</body>
</html>
